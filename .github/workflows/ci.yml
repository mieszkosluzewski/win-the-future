name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://wtf:wtf@localhost:5432/win_the_future

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest