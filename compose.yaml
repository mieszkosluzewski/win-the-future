services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: win_the_future
      POSTGRES_USER: wtf
      POSTGRES_PASSWORD: wtf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtf -d win_the_future"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: